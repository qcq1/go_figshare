basePath: /v2
definitions:
  Account:
    properties:
      active:
        description: Account activity status
        example: 0
        format: int64
        type: integer
      created_date:
        description: Date when account was created
        example: '2018-05-22T04:04:04'
        type: string
      email:
        description: User email
        example: user@domain.com
        type: string
      first_name:
        description: First Name
        example: Doe
        type: string
      group_id:
        description: Account group id
        example: 0
        format: int64
        type: integer
      id:
        description: Account id
        example: 1495682
        format: int64
        type: integer
      institution_id:
        description: Account institution
        example: 1
        format: int64
        type: integer
      institution_user_id:
        description: Account institution user id
        example: djohn42
        type: string
      last_name:
        description: Last Name
        example: John
        type: string
      maximum_file_size:
        description: Maximum upload size for account
        example: 0
        format: int64
        type: integer
      modified_date:
        description: Date of last account modification
        example: '2018-05-22T04:04:04'
        type: string
      orcid_id:
        description: ORCID iD associated to account
        example: 0000-0001-2345-6789
        type: string
      pending_quota_request:
        description: True if a quota request is pending
        example: true
        type: boolean
      quota:
        description: Account quota
        example: 0
        format: int64
        type: integer
      symplectic_user_id:
        description: Symplectic ID associated to account
        example: djohn42
        type: string
      used_quota:
        description: Account total used quota
        example: 0
        format: int64
        type: integer
      used_quota_private:
        description: Account used private quota
        example: 0
        format: int64
        type: integer
      used_quota_public:
        description: Account public used quota
        example: 0
        format: int64
        type: integer
      user_id:
        description: User id associated with account, useful for example for adding
          the account as an author to an item
        example: 1000001
        format: int64
        type: integer
    required:
    - id
    - first_name
    - last_name
    - used_quota_private
    - modified_date
    - used_quota
    - created_date
    - quota
    - group_id
    - institution_user_id
    - institution_id
    - email
    - used_quota_public
    - pending_quota_request
    - active
    - maximum_file_size
    - user_id
    - orcid_id
    - symplectic_user_id
    type: object
    x-model: Account
    x-tag: other
  AccountCreate:
    properties:
      email:
        description: Email of account
        example: johndoe@example.com
        maxLength: 150
        minLength: 3
        type: string
      first_name:
        default: ''
        description: First Name
        example: John
        maxLength: 255
        type: string
      group_id:
        description: Not applicable to regular users. This field is reserved to institutions/publishers
          with access to assign to specific groups
        format: int64
        type: integer
      institution_user_id:
        default: ''
        description: Institution user id
        example: johndoe
        maxLength: 50
        type: string
      is_active:
        description: Is account active
        type: boolean
      last_name:
        default: ''
        description: Last Name
        example: Doe
        maxLength: 255
        type: string
      quota:
        description: Account quota
        example: 1000
        format: int64
        type: integer
      symplectic_user_id:
        default: ''
        description: Symplectic user id
        example: johndoe
        maxLength: 50
        type: string
    required:
    - email
    - last_name
    type: object
    x-maxCombinedLength:
      description: The combined length of first_name and last_name must not exceed
        255 characters.
    x-model: AccountCreate
    x-tag: institutions
  AccountCreateResponse:
    properties:
      account_id:
        description: ID of created account
        example: 33334444
        format: int64
        type: integer
    required:
    - account_id
    type: object
    x-model: AccountCreateResponse
    x-tag: common
  AccountGroupRoles:
    example:
      '2':
      - category: group
        id: 7
        name: User
    properties: {}
    type: object
    x-model: AccountGroupRoles
    x-tag: institutions
  AccountGroupRolesCreate:
    example:
      '2':
      - 2
      - 7
      '3':
      - 7
      - 9
    properties: {}
    type: object
    x-model: AccountGroupRolesCreate
    x-tag: institutions
  AccountReport:
    properties:
      account_id:
        description: The ID of the account which generated this report.
        format: int64
        type: integer
      created_date:
        description: Date when the AccountReport was requested
        example: '2017-05-15T15:12:26Z'
        type: string
      download_url:
        description: The download link for the generated XLSX
        example: https://some.com/storage/path/123/report-456.xlsx
        format: url
        type: string
      group_id:
        description: The group ID that was used to filter the report, if any.
        format: int64
        type: integer
      id:
        description: A unique ID for the AccountRecord
        format: int64
        type: integer
      status:
        description: Status of the report
        enum:
        - missing
        - pending
        - done
        type: string
    required:
    - id
    - account_id
    - created_date
    - status
    - download_url
    - group_id
    type: object
    x-model: AccountReport
  AccountUpdate:
    properties:
      group_id:
        description: Not applicable to regular users. This field is reserved to institutions/publishers
          with access to assign to specific groups
        format: int64
        type: integer
      is_active:
        description: Is account active
        type: boolean
    required:
    - group_id
    - is_active
    type: object
    x-model: AccountUpdate
    x-tag: institutions
  Article:
    properties:
      created_date:
        description: Date when article was created
        example: '2017-05-18T11:49:03Z'
        type: string
      defined_type:
        description: Type of article identifier
        example: 3
        format: int64
        type: integer
      defined_type_name:
        description: Name of the article type identifier
        example: media
        type: string
      doi:
        description: DOI
        example: 10.6084/m9.figshare.1434614
        type: string
      group_id:
        description: Group ID
        example: 1234
        type:
        - number
        - 'null'
      handle:
        description: Handle
        example: 111184/figshare.1234
        type: string
      id:
        description: Unique identifier for article
        example: 1434614
        format: int64
        type: integer
      modified_date:
        description: Date when article was last modified
        example: '2017-05-18T11:49:03Z'
        type:
        - string
        - 'null'
      published_date:
        description: Posted date
        example: '2015-12-31T23:59:59.000Z'
        type:
        - string
        - 'null'
      resource_doi:
        default: ''
        description: Deprecated by related materials. Not applicable to regular users.
          In a publisher case, this is the publisher article DOI.
        type: string
      resource_title:
        default: ''
        description: Deprecated by related materials. Not applicable to regular users.
          In a publisher case, this is the publisher article title.
        type: string
      thumb:
        description: Thumbnail image
        example: https://ndownloader.figshare.com/files/123456789/preview/12345678/thumb.png
        format: url
        type: string
      timeline:
        $ref: '#/definitions/Timeline'
        description: Various timeline dates
        type: object
      title:
        description: Title of article
        example: Test article title
        type: string
      url:
        description: Api endpoint for article
        example: http://api.figshare.com/articles/1434614
        format: url
        type: string
      url_private_api:
        description: Private Api endpoint for article
        example: https://api.figshare.com/account/articles/1434614
        format: url
        type: string
      url_private_html:
        description: Private site endpoint for article
        example: https://figshare.com/account/articles/1434614
        format: url
        type: string
      url_public_api:
        description: Public Api endpoint for article
        example: https://api.figshare.com/articles/1434614
        format: url
        type: string
      url_public_html:
        description: Public site endpoint for article
        example: https://figshare.com/articles/media/Test_article_title/1434614
        format: url
        type: string
    required:
    - id
    - title
    - resource_doi
    - resource_title
    - doi
    - handle
    - group_id
    - url
    - url_public_html
    - url_public_api
    - url_private_html
    - url_private_api
    - published_date
    - timeline
    - thumb
    - defined_type
    - defined_type_name
    - created_date
    - modified_date
    type: object
    x-model: Article
    x-tag: articles
  ArticleComplete:
    allOf:
    - $ref: '#/definitions/ProjectArticle'
    properties:
      authors:
        description: List of article authors
        items:
          $ref: '#/definitions/Author'
        type: array
      custom_fields:
        description: List of custom fields values
        items:
          $ref: '#/definitions/CustomArticleField'
        type: array
      download_disabled:
        description: If true, downloading of files for this article is disabled
        example: false
        type: boolean
      embargo_options:
        description: List of embargo options
        items:
          $ref: '#/definitions/GroupEmbargoOptions'
        type: array
      figshare_url:
        description: Article public url
        example: http://figshare.com/articles/media/article_name/2000005
        format: url
        type: string
      files:
        description: List of article files
        items:
          $ref: '#/definitions/PublicFile'
        type: array
      folder_structure:
        description: Mapping of file ids to folder paths, if folders are used
        example:
          '3000002': Test Folder
        type: object
    required:
    - figshare_url
    - resource_title
    - resource_doi
    - files
    - folder_structure
    - authors
    - custom_fields
    - embargo_options
    - citation
    - confidential_reason
    - embargo_type
    - is_confidential
    - size
    - funding
    - funding_list
    - tags
    - keywords
    - version
    - is_metadata_record
    - metadata_reason
    - status
    - description
    - is_embargoed
    - embargo_date
    - is_public
    - modified_date
    - created_date
    - has_linked_file
    - categories
    - license
    - embargo_title
    - embargo_reason
    - references
    - id
    - title
    - doi
    - handle
    - group_id
    - url
    - url_public_html
    - url_public_api
    - url_private_html
    - url_private_api
    - published_date
    - timeline
    - thumb
    - defined_type
    - defined_type_name
    - download_disabled
    type: object
    x-model: ArticleComplete
    x-tag: articles
  ArticleCompletePrivate:
    allOf:
    - $ref: '#/definitions/ArticleComplete'
    properties:
      account_id:
        description: ID of the account owning the article
        example: 1000001
        format: int64
        type: integer
      curation_status:
        description: Curation status of the article
        example: approved
        type: string
      group_resource_id:
        description: Group resource id
        example: 1
        type:
        - string
        - 'null'
    required:
    - group_resource_id
    - account_id
    - figshare_url
    - resource_title
    - resource_doi
    - files
    - folder_structure
    - authors
    - custom_fields
    - embargo_options
    - citation
    - confidential_reason
    - embargo_type
    - is_confidential
    - size
    - funding
    - funding_list
    - array[integer](optional)
    - tags
    - keywords
    - version
    - is_metadata_record
    - metadata_reason
    - status
    - description
    - is_embargoed
    - embargo_date
    - is_public
    - modified_date
    - created_date
    - has_linked_file
    - categories
    - license
    - embargo_title
    - embargo_reason
    - references
    - id
    - title
    - doi
    - handle
    - group_id
    - url
    - url_public_html
    - url_public_api
    - url_private_html
    - url_private_api
    - published_date
    - timeline
    - thumb
    - defined_type
    - defined_type_name
    - download_disabled
    - curation_status
    type: object
    x-model: ArticleCompletePrivate
    x-tag: articles
  ArticleConfidentiality:
    properties:
      is_confidential:
        description: True if article is confidential
        example: true
        type: boolean
      reason:
        description: Reason for confidentiality
        example: need to
        type: string
    required:
    - is_confidential
    - reason
    type: object
    x-model: ArticleConfidentiality
    x-tag: articles
  ArticleCreate:
    properties:
      authors:
        default: []
        description: 'List of authors to be associated with the article. The list
          can contain the following fields: id, name, first_name, last_name, email,
          orcid_id. If an id is supplied, it will take priority and everything else
          will be ignored. For adding more authors use the specific authors endpoint.'
        example:
        - name: John Doe
        - id: 1000008
        items:
          type: object
        type: array
      categories:
        default: []
        description: List of category ids to be associated with the article(e.g [1,
          23, 33, 66])
        example:
        - 1
        - 10
        - 11
        items:
          format: int64
          type: integer
        type: array
      categories_by_source_id:
        default: []
        description: List of category source ids to be associated with the article,
          supersedes the categories property
        example:
        - '300204'
        - '400207'
        items:
          type: string
        type: array
      custom_fields:
        description: List of key, values pairs to be associated with the article
        example:
          defined_key: value for it
        type: object
      custom_fields_list:
        description: List of custom fields values, supersedes custom_fields parameter
        items:
          $ref: '#/definitions/CustomArticleFieldAdd'
        type: array
      defined_type:
        description: <b>One of:</b> <code>figure</code> <code>online resource</code>
          <code>preprint</code> <code>book</code> <code>conference contribution</code>
          <code>media</code> <code>dataset</code> <code>poster</code> <code>journal
          contribution</code> <code>presentation</code> <code>thesis</code> <code>software</code>
        example: media
        type: string
      description:
        default: ''
        description: The article description. In a publisher case, usually this is
          the remote article description
        example: Test description of article
        maxLength: 20000
        type: string
      doi:
        default: ''
        description: Not applicable for regular users. In an institutional case, make
          sure your group supports setting DOIs. This setting is applied by figshare
          via opening a ticket through our support/helpdesk system.
        type: string
      funding:
        default: ''
        description: Grant number or funding authority
        type: string
      funding_list:
        description: Funding creation / update items
        items:
          $ref: '#/definitions/FundingCreate'
        type: array
      group_id:
        description: Not applicable to regular users. This field is reserved to institutions/publishers
          with access to assign to specific groups
        format: int64
        type: integer
      handle:
        default: ''
        description: Not applicable for regular users. In an institutional case, make
          sure your group supports setting Handles. This setting is applied by figshare
          via opening a ticket through our support/helpdesk system.
        type: string
      is_metadata_record:
        description: True if article has no files
        example: true
        type: boolean
      keywords:
        default: []
        description: List of tags to be associated with the article. Tags can be used
          instead
        example:
        - tag1
        - tag2
        items:
          type: string
        type: array
      license:
        default: 0
        description: License id for this article.
        example: 1
        format: int64
        type: integer
      metadata_reason:
        description: Article metadata reason
        example: hosted somewhere else
        type: string
      references:
        default: []
        description: List of links to be associated with the article (e.g ["http://link1",
          "http://link2", "http://link3"])
        example:
        - http://figshare.com
        - http://api.figshare.com
        items:
          format: link
          type: string
        type: array
      related_materials:
        default: []
        description: List of related materials; supersedes references and resource
          DOI/title.
        example:
        - id: 10432
          identifier: 10.6084/m9.figshare.1407024
          identifier_type: DOI
          is_linkout: false
          relation: IsSupplementTo
          title: Figshare for institutions brochure
        items:
          $ref: '#/definitions/RelatedMaterial'
        type: array
      resource_doi:
        default: ''
        description: Deprecated by related materials. Not applicable to regular users.
          In a publisher case, this is the publisher article DOI.
        type: string
      resource_title:
        default: ''
        description: Deprecated by related materials. Not applicable to regular users.
          In a publisher case, this is the publisher article title.
        type: string
      tags:
        default: []
        description: List of tags to be associated with the article. Keywords can
          be used instead
        example:
        - tag1
        - tag2
        items:
          type: string
        type: array
      timeline:
        $ref: '#/definitions/TimelineUpdate'
        description: Various timeline dates
        type: object
      title:
        description: Title of article
        example: Test article title
        maxLength: 1000
        minLength: 3
        type: string
    required:
    - title
    type: object
    x-model: ArticleCreate
    x-tag: articles
  ArticleDOI:
    properties:
      doi:
        description: Reserved DOI
        example: 10.5072/FK2.FIGSHARE.20345
        type: string
    required:
    - doi
    type: object
    x-model: ArticleDOI
    x-tag: articles
  ArticleEmbargo:
    properties:
      embargo_date:
        description: Date when embargo lifts
        example: '2018-05-22T04:04:04'
        type:
        - string
        - 'null'
      embargo_options:
        description: List of embargo permissions that are associated with the article.
          If the type is logged_in and the group_ids list is empty, then the whole
          institution can see the article; if there are multiple group_ids, then only
          users that are under those groups can see the article.
        example:
        - group_ids: []
          id: 13
          ip_name: bacau
          type: ip_range
        - group_ids:
          - 550
          - 9448
          id: 12
          ip_name: ''
          type: logged_in
        items:
          type: object
        type: array
      embargo_reason:
        description: Reason for embargo
        example: ''
        type: string
      embargo_title:
        description: Title for embargo
        example: File(s) under embargo
        type: string
      embargo_type:
        description: Embargo type
        example: article
        type:
        - string
        - 'null'
      is_embargoed:
        description: True if embargoed
        example: true
        type: boolean
    required:
    - is_embargoed
    - embargo_date
    - embargo_type
    - embargo_title
    - embargo_reason
    - embargo_options
    type: object
    x-model: ArticleEmbargo
    x-tag: articles
  ArticleEmbargoUpdater:
    properties:
      embargo_date:
        description: Date when the embargo expires and the article gets published,
          '0' value will set up permanent embargo
        example: '2018-05-22T04:04:04'
        type: string
      embargo_options:
        description: List of embargo permissions to be associated with the article.
          The list must contain `id` and can also contain `group_ids`(a field that
          only applies to 'logged_in' permissions). The new list replaces old options
          in the database, and an empty list removes all permissions for this article.
          Administration permission has to be set up alone but logged in and IP range
          permissions can be set up together.
        example:
        - id: 1321
        - id: 3345
        - group_ids:
          - 4332
          - 5433
          - 678
          id: 54621
        items:
          type: object
        type: array
      embargo_reason:
        description: Reason for setting embargo
        example: ''
        type: string
      embargo_title:
        description: Title for embargo
        example: File(s) under embargo
        type: string
      embargo_type:
        description: 'Embargo can be enabled at the article or the file level. Possible
          values: article, file'
        enum:
        - article
        - file
        example: file
        type: string
      is_embargoed:
        description: Embargo status
        example: true
        type: boolean
    required:
    - is_embargoed
    - embargo_type
    - embargo_date
    type: object
    x-model: ArticleEmbargoUpdater
    x-tag: articles
  ArticleHandle:
    properties:
      handle:
        description: Reserved Handle
        example: 11172/FK2.FIGSHARE.20345
        type: string
    required:
    - handle
    type: object
    x-model: ArticleHandle
    x-tag: articles
