        - IsSupplementTo
        - IsSupplementedBy
        - IsContinuedBy
        - Continues
        - Describes
        - IsDescribedBy
        - HasMetadata
        - IsMetadataFor
        - HasVersion
        - IsVersionOf
        - IsNewVersionOf
        - IsPreviousVersionOf
        - IsPartOf
        - HasPart
        - IsPublishedIn
        - IsReferencedBy
        - References
        - IsDocumentedBy
        - Documents
        - IsCompiledBy
        - Compiles
        - IsVariantFormOf
        - IsOriginalFormOf
        - IsIdenticalTo
        - IsReviewedBy
        - Reviews
        - IsDerivedFrom
        - IsSourceOf
        - IsRequiredBy
        - Requires
        - IsObsoletedBy
        - Obsoletes
        example: IsSupplementTo
        type: string
      title:
        description: The related material title
        example: 'Rooter: A Methodology for the Typical Unification of Access Points
          and Redundancy'
        type: string
    type: object
    x-model: RelatedMaterial
  Resource:
    properties:
      doi:
        default: ''
        description: DOI of resource item
        type: string
      id:
        default: ''
        description: ID of resource item
        example: aaaa23512
        maxLength: 255
        type: string
      link:
        default: ''
        description: Link of resource item
        example: https://docs.figshare.com
        maxLength: 255
        type: string
      status:
        default: ''
        description: Status of resource item
        example: frozen
        maxLength: 100
        type: string
      title:
        default: ''
        description: Title of resource item
        example: Test title
        maxLength: 1000
        type: string
      version:
        default: 0
        description: Version of resource item
        example: 1
        format: int64
        type: integer
    type: object
    x-model: Resource
    x-tag: resource
  ResponseMessage:
    properties:
      message:
        description: Response message text
        example: Project 1 has been published
        type: string
    required:
    - message
    type: object
    x-model: ResponseMessage
    x-tag: common
  Role:
    properties:
      category:
        description: Role category
        example: group
        type: string
      description:
        description: Role description
        type: string
      id:
        description: Role id
        example: 1
        format: int64
        type: integer
      name:
        description: Role name
        example: Curator
        type: string
    required:
    - id
    - name
    - category
    - description
    type: object
    x-model: Role
    x-tag: institutions
  ShortAccount:
    properties:
      active:
        description: Account activity status
        example: 0
        format: int64
        type: integer
      email:
        description: User email
        example: user@domain.com
        type: string
      first_name:
        description: First Name
        example: Doe
        type: string
      id:
        description: Account id
        example: 1495682
        format: int64
        type: integer
      institution_id:
        description: Account institution
        example: 1
        format: int64
        type: integer
      institution_user_id:
        description: Account institution user id
        example: 1
        type: string
      last_name:
        description: Last Name
        example: John
        type: string
      orcid_id:
        description: ORCID iD associated to account
        example: 0000-0001-2345-6789
        type: string
      quota:
        description: Total storage available to account, in bytes
        example: 1074000000
        format: int64
        type: integer
      symplectic_user_id:
        description: Symplectic ID associated to account
        example: djohn42
        type: string
      used_quota:
        description: Storage used by the account, in bytes
        example: 1074000000
        format: int64
        type: integer
      user_id:
        description: User id associated with account, useful for example for adding
          the account as an author to an item
        example: 1000001
        format: int64
        type: integer
    required:
    - id
    - first_name
    - last_name
    - institution_id
    - email
    - active
    - institution_user_id
    - quota
    - used_quota
    - user_id
    - orcid_id
    - symplectic_user_id
    type: object
    x-model: ShortAccount
    x-tag: other
  ShortCustomField:
    properties:
      field_type:
        description: Custom field type
        enum:
        - text
        - textarea
        - dropdown
        - url
        - email
        - date
        - dropdown_large_list
        example: textarea
        type: string
      id:
        description: Custom field id
        example: 365
        format: int64
        type: integer
      is_mandatory:
        description: Whether the field is mandatory or not
        example: false
        type: boolean
      name:
        description: Custom field name
        example: my custom field
        type: string
      order:
        description: Order of the field in the group
        example: 1
        format: int64
        type: integer
      settings:
        description: Settings for the custom field
        example:
          placeholder: Enter your custom field here
          validations:
            max_length: 1000
            min_length: 1
        type: object
    required:
    - id
    - name
    - field_type
    type: object
    x-model: ShortCustomField
    x-tag: institutions
  Timeline:
    allOf:
    - $ref: '#/definitions/TimelineUpdate'
    properties:
      posted:
        description: Posted date
        example: '2015-12-31'
        type:
        - string
        - 'null'
      revision:
        description: Revision date from curation (if curated)
        example: '2015-12-31'
        type:
        - string
        - 'null'
      submission:
        description: Submission date in curation (if curated)
        example: '2015-12-31'
        type:
        - string
        - 'null'
    required:
    - posted
    - submission
    - revision
    - firstOnline
    - publisherPublication
    - publisherAcceptance
    type: object
    x-model: Timeline
    x-tag: timeline
  TimelineUpdate:
    properties:
      firstOnline:
        description: Online posted date
        example: '2015-12-31'
        type: string
      publisherAcceptance:
        description: Date when the item was accepted for publication
        example: '2015-12-31'
        type: string
      publisherPublication:
        description: Publish date
        example: '2015-12-31'
        type: string
    type: object
    x-model: TimelineUpdate
    x-tag: timeline_update
  UploadFilePart:
    properties:
      endOffset:
        description: Indexes on byte range. zero-based and inclusive
        example: 69
        format: int64
        type: integer
      locked:
        description: When a part is being uploaded it is being locked, by setting
          the locked flag to true. No changes/uploads can happen on this part from
          other requests.
        type: boolean
      partNo:
        description: File part id
        example: 1
        format: int64
        type: integer
      startOffset:
        description: Indexes on byte range. zero-based and inclusive
        example: 0
        format: int64
        type: integer
      status:
        description: part status
        enum:
        - PENDING
        - COMPLETE
        type: string
    type: object
    x-model: UploadFilePart
    x-tag: upload
  UploadInfo:
    properties:
      md5:
        description: md5 provided on upload initialization
        example: 3a7f451c068f4e13260034c611378140
        type: string
      name:
        description: name of file on upload server
        example: 3000017/test.py
        type: string
      parts:
        description: Uploads parts
        items:
          $ref: '#/definitions/UploadFilePart'
        type: array
      size:
        description: size of file in bytes
        example: 70
        format: int64
        type: integer
      status:
        description: Upload status
        enum:
        - PENDING
        - COMPLETED
        - ABORTED
        type: string
      token:
        description: token received after initializing a file upload
        example: 693a2802-cd61-430d-b89f-507f0f6d8fd3
        type: string
    type: object
    x-model: UploadInfo
    x-tag: upload
  User:
    properties:
      first_name:
        description: First Name
        example: Doe
        type: string
      id:
        description: User id
        example: 1495682
        format: int64
        type: integer
      is_active:
        description: Account activity status
        example: true
        type: boolean
      is_public:
        description: Account public status
        example: true
        type: boolean
      job_title:
        description: User Job title
        example: programmer
        type: string
      last_name:
        description: Last Name
        example: John
        type: string
      name:
        description: Full Name
        example: John Doe
        type: string
      orcid_id:
        description: Orcid associated to this User
        example: 1234-5678-9123-1234
        type: string
      url_name:
        description: Name that appears in website url
        example: John_Doe
        type: string
    required:
    - id
    - first_name
    - last_name
    - name
    - is_active
    - url_name
    - is_public
    - job_title
    - orcid_id
    type: object
    x-model: User
    x-tag: other
host: api.figinternal.dev
info:
  description: Figshare apiv2. Using Swagger 2.0
  title: Figshare API
  version: 2.0.0
paths:
  /account:
    get:
      description: Account information for token/personal token
      operationId: private_account
      responses:
        '200':
          description: OK. Account representation
          schema:
            $ref: '#/definitions/Account'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Private Account information
      tags:
      - other
  /account/articles:
    get:
      description: Get Own Articles
      operationId: private_articles_list
      parameters:
      - description: Page number. Used for pagination with page_size
        format: int64
        in: query
        maximum: 5000
        minimum: 1
        name: page
        required: false
        type: integer
      - default: 10
        description: The number of results included on a page. Used for pagination
          with page
        format: int64
        in: query
        maximum: 1000
        minimum: 1
        name: page_size
        required: false
        type: integer
      - description: Number of results included on a page. Used for pagination with
          query
        format: int64
        in: query
        maximum: 1000
        minimum: 1
        name: limit
        required: false
        type: integer
      - description: Where to start the listing (the offset of the first result).
          Used for pagination with limit
        format: int64
        in: query
        maximum: 5000
        minimum: 0
        name: offset
        required: false
        type: integer
      responses:
        '200':
          description: OK. An array of articles belonging to the account
          schema:
            items:
              $ref: '#/definitions/Article'
            type: array
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Private Articles
      tags:
      - articles
    post:
      description: Create a new Article by sending article information
      operationId: private_article_create
      parameters:
      - description: Article description
        in: body
        name: Article
        required: true
        schema:
          $ref: '#/definitions/ArticleCreate'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/LocationWarnings'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Create new Article
      tags:
      - articles
      x-subcategory: Private Article
  /account/articles/export:
    get:
      description: Return status on all reports generated for the account from the
        oauth credentials
      operationId: account_article_report
      parameters:
      - description: A group ID to filter by
        format: int64
        in: query
        name: group_id
        required: false
        type: integer
      responses:
        '200':
          description: OK. An array of account report entries
          schema:
            items:
              $ref: '#/definitions/AccountReport'
            type: array
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Account Article Report
      tags:
      - articles
    post:
      description: Initiate a new Article Report for this Account. There is a limit
        of 1 report per day.
      operationId: account_article_report_generate
      responses:
        '200':
          description: OK. AccountReport created.
          schema:
            $ref: '#/definitions/AccountReport'
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Initiate a new Report
      tags:
      - articles
  /account/articles/search:
    post:
      description: Returns a list of private articles filtered by the search parameters
      operationId: private_articles_search
      parameters:
      - description: Search Parameters
        in: body
        name: search
        required: true
        schema:
          $ref: '#/definitions/PrivateArticleSearch'
      responses:
        '200':
          description: OK. An array of articles
          schema:
            items:
              $ref: '#/definitions/ArticleWithProject'
            type: array
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Private Articles search
      tags:
      - articles
  /account/articles/{article_id}:
    delete:
      description: Delete an article
      operationId: private_article_delete
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Delete article
      tags:
      - articles
      x-subcategory: Private Article
    get:
      description: View a private article
      operationId: private_article_details
      responses:
        '200':
          description: OK. Article representation
          schema:
            $ref: '#/definitions/ArticleCompletePrivate'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Article details
      tags:
      - articles
      x-subcategory: Private Article
    parameters:
    - description: Article unique identifier
      format: int64
      in: path
      minimum: 1
      name: article_id
      required: true
      type: integer
    patch:
      description: Partially update an article by sending only the fields to change.
      operationId: private_article_partial_update
      parameters:
      - description: Subset of article fields to update
        in: body
        name: Article
        required: true
        schema:
          $ref: '#/definitions/ArticleUpdate'
      responses:
        '205':
          description: Reset Content
          headers:
            Location:
              description: Location of the updated article
              format: link
              type: string
          schema:
            $ref: '#/definitions/LocationWarningsUpdate'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Partially update article
      tags:
      - articles
      x-subcategory: Private Article
    put:
      description: Update an article by passing full body parameters.
      operationId: private_article_update
      parameters:
      - description: Full article representation
        in: body
        name: Article
        required: true
        schema:
          $ref: '#/definitions/ArticleUpdate'
      responses:
        '205':
          description: Reset Content
          headers:
            Location:
              description: Location of newly created article
              format: link
              type: string
          schema:
            $ref: '#/definitions/LocationWarningsUpdate'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Update article
      tags:
      - articles
      x-subcategory: Private Article
  /account/articles/{article_id}/authors:
    get:
      description: List article authors
      operationId: private_article_authors_list
      responses:
        '200':
          description: OK. Authors list for article
          schema:
            items:
              $ref: '#/definitions/Author'
            type: array
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: List article authors
      tags:
      - articles
      x-subcategory: Private Article Authors
    parameters:
    - description: Article unique identifier
      format: int64
      in: path
      minimum: 1
      name: article_id
      required: true
      type: integer
    post:
      description: Associate new authors with the article. This will add new authors
        to the list of already associated authors
      operationId: private_article_authors_add
      parameters:
      - description: Authors description
        in: body
        name: Authors
        required: true
        schema:
          $ref: '#/definitions/AuthorsCreator'
      responses:
        '205':
          description: Reset Content
          headers:
            Location:
              description: Location of list of authors
              format: url
              type: string
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Add article authors
      tags:
      - articles
      x-subcategory: Private Article Authors
    put:
      description: Associate new authors with the article. This will remove all already
        associated authors and add these new ones
      operationId: private_article_authors_replace
      parameters:
      - description: Authors description
        in: body
        name: Authors
        required: true
        schema:
          $ref: '#/definitions/AuthorsCreator'
      responses:
        '205':
          description: Reset Content
          headers:
            Location:
              description: Location of list of authors
              format: url
              type: string
        '400':
          description: Bad Request. Article ID must be an integer and bigger than
            0. Author with ID Not Found.
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Replace article authors
      tags:
      - articles
      x-subcategory: Private Article Authors
  /account/articles/{article_id}/authors/{author_id}:
    delete:
      description: De-associate author from article
      operationId: private_article_author_delete
      parameters:
      - description: Article unique identifier
        format: int64
        in: path
        minimum: 1
        name: article_id
        required: true
        type: integer
      - description: Article Author unique identifier
        format: int64
        in: path
        minimum: 1
        name: author_id
        required: true
        type: integer
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Delete article author
      tags:
      - articles
      x-subcategory: Private Article Authors
  /account/articles/{article_id}/categories:
    get:
      description: List article categories
      operationId: private_article_categories_list
      responses:
        '200':
          description: OK. Article categories
          schema:
            items:
              $ref: '#/definitions/Category'
            type: array
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: List article categories
      tags:
      - articles
      x-subcategory: Private Article Categories
    parameters:
    - description: Article unique identifier
      format: int64
      in: path
      minimum: 1
      name: article_id
      required: true
      type: integer
    post:
      description: Associate new categories with the article. This will add new categories
        to the list of already associated categories
      operationId: private_article_categories_add
      parameters:
      - in: body
        name: categories
        required: true
        schema:
          $ref: '#/definitions/CategoriesCreator'
      responses:
        '205':
          description: Reset Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Add article categories
      tags:
      - articles
      x-subcategory: Private Article Categories
    put:
      description: Associate new categories with the article. This will remove all
        already associated categories and add these new ones
      operationId: private_article_categories_replace
      parameters:
      - in: body
        name: categories
        required: true
        schema:
          $ref: '#/definitions/CategoriesCreator'
      responses:
        '205':
          description: Reset Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Replace article categories
      tags:
      - articles
      x-subcategory: Private Article Categories
  /account/articles/{article_id}/categories/{category_id}:
    delete:
      description: De-associate category from article
      operationId: private_article_category_delete
      parameters:
      - description: Article unique identifier
        format: int64
        in: path
        minimum: 1
        name: article_id
        required: true
        type: integer
      - description: Category unique identifier
        format: int64
        in: path
        minimum: 1
        name: category_id
        required: true
        type: integer
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Delete article category
      tags:
      - articles
      x-subcategory: Private Article Categories
  /account/articles/{article_id}/confidentiality:
    delete:
      description: Delete confidentiality settings. The confidentiality feature is
        now deprecated. This has been replaced by the new extended embargo functionality
        and all items that used to be confidential have now been migrated to items
        with a permanent embargo on files. All API endpoints related to this functionality
        will remain for backwards compatibility, but will now be attached to the new
        extended embargo workflows.
      operationId: private_article_confidentiality_delete
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Delete article confidentiality
      tags:
      - articles
      x-subcategory: Private Article Confidentiality - DEPRECATED
    get:
      description: View confidentiality settings. The confidentiality feature is now
        deprecated. This has been replaced by the new extended embargo functionality
        and all items that used to be confidential have now been migrated to items
        with a permanent embargo on files. All API endpoints related to this functionality
        will remain for backwards compatibility, but will now be attached to the new
        extended embargo workflows.
      operationId: private_article_confidentiality_details
      responses:
        '200':
          description: OK. Article categories
          schema:
            $ref: '#/definitions/ArticleConfidentiality'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Article confidentiality details
      tags:
      - articles
      x-subcategory: Private Article Confidentiality - DEPRECATED
    parameters:
    - description: Article unique identifier
      format: int64
      in: path
      minimum: 1
      name: article_id
      required: true
      type: integer
    put:
      description: Update confidentiality settings. The confidentiality feature is
        now deprecated. This has been replaced by the new extended embargo functionality
        and all items that used to be confidential have now been migrated to items
        with a permanent embargo on files. All API endpoints related to this functionality
        will remain for backwards compatibility, but will now be attached to the new
        extended embargo workflows.
