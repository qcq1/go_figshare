      firstOnline:
        description: Online posted date
        example: '2015-12-31'
        type: string
      publisherAcceptance:
        description: Date when the item was accepted for publication
        example: '2015-12-31'
        type: string
      publisherPublication:
        description: Publish date
        example: '2015-12-31'
        type: string
    type: object
    x-model: TimelineUpdate
    x-tag: timeline_update
  UploadFilePart:
    properties:
      endOffset:
        description: Indexes on byte range. zero-based and inclusive
        example: 69
        format: int64
        type: integer
      locked:
        description: When a part is being uploaded it is being locked, by setting
          the locked flag to true. No changes/uploads can happen on this part from
          other requests.
        type: boolean
      partNo:
        description: File part id
        example: 1
        format: int64
        type: integer
      startOffset:
        description: Indexes on byte range. zero-based and inclusive
        example: 0
        format: int64
        type: integer
      status:
        description: part status
        enum:
        - PENDING
        - COMPLETE
        type: string
    type: object
    x-model: UploadFilePart
    x-tag: upload
  UploadInfo:
    properties:
      md5:
        description: md5 provided on upload initialization
        example: 3a7f451c068f4e13260034c611378140
        type: string
      name:
        description: name of file on upload server
        example: 3000017/test.py
        type: string
      parts:
        description: Uploads parts
        items:
          $ref: '#/definitions/UploadFilePart'
        type: array
      size:
        description: size of file in bytes
        example: 70
        format: int64
        type: integer
      status:
        description: Upload status
        enum:
        - PENDING
        - COMPLETED
        - ABORTED
        type: string
      token:
        description: token received after initializing a file upload
        example: 693a2802-cd61-430d-b89f-507f0f6d8fd3
        type: string
    type: object
    x-model: UploadInfo
    x-tag: upload
  User:
    properties:
      first_name:
        description: First Name
        example: Doe
        type: string
      id:
        description: User id
        example: 1495682
        format: int64
        type: integer
      is_active:
        description: Account activity status
        example: true
        type: boolean
      is_public:
        description: Account public status
        example: true
        type: boolean
      job_title:
        description: User Job title
        example: programmer
        type: string
      last_name:
        description: Last Name
        example: John
        type: string
      name:
        description: Full Name
        example: John Doe
        type: string
      orcid_id:
        description: Orcid associated to this User
        example: 1234-5678-9123-1234
        type: string
      url_name:
        description: Name that appears in website url
        example: John_Doe
        type: string
    required:
    - id
    - first_name
    - last_name
    - name
    - is_active
    - url_name
    - is_public
    - job_title
    - orcid_id
    type: object
    x-model: User
    x-tag: other
