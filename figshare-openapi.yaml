info:
  description: Figshare apiv2. Using Swagger 2.0
  title: Figshare API
  version: 2.0.0
paths:
  /articles:
    get:
      description: Returns a list of public articles
      operationId: articles_list
      parameters:
      - description: Unique hash used for bypassing the item retrieval limit of 9,000
          entities. When using this parameter, please note that the offset parameter
          will not be available, but the limit parameter will still work as expected.
        format: uuid
        in: header
        name: X-Cursor
        required: false
        type: string
      - description: Page number. Used for pagination with page_size
        format: int64
        in: query
        maximum: 5000
        minimum: 1
        name: page
        required: false
        type: integer
      - default: 10
        description: The number of results included on a page. Used for pagination
          with page
        format: int64
        in: query
        maximum: 1000
        minimum: 1
        name: page_size
        required: false
        type: integer
      - description: Number of results included on a page. Used for pagination with
          query
        format: int64
        in: query
        maximum: 1000
        minimum: 1
        name: limit
        required: false
        type: integer
      - description: Where to start the listing (the offset of the first result).
          Used for pagination with limit
        format: int64
        in: query
        maximum: 5000
        minimum: 0
        name: offset
        required: false
        type: integer
      - default: published_date
        description: The field by which to order. Default varies by endpoint/resource.
        enum:
        - published_date
        - created_date
        - modified_date
        - views
        - shares
        - downloads
        - cites
        in: query
        name: order
        required: false
        type: string
      - default: desc
        enum:
        - asc
        - desc
        in: query
        name: order_direction
        required: false
        type: string
      - description: only return articles from this institution
        format: int64
        in: query
        name: institution
        required: false
        type: integer
      - description: Filter by article publishing date. Will only return articles
          published after the date. date(ISO 8601) YYYY-MM-DD or date-time(ISO 8601)
          YYYY-MM-DDTHH:mm:ssZ
        in: query
        name: published_since
        required: false
        type: string
      - description: Filter by article modified date. Will only return articles published
          after the date. date(ISO 8601) YYYY-MM-DD or date-time(ISO 8601) YYYY-MM-DDTHH:mm:ssZ
        in: query
        name: modified_since
        required: false
        type: string
      - description: only return articles from this group
        format: int64
        in: query
        name: group
        required: false
        type: integer
      - description: Deprecated by related materials. Only return articles with this
          resource_doi
        in: query
        name: resource_doi
        required: false
        type: string
      - description: 'Only return articles with the respective type. Mapping for item_type
          is: 1 - Figure, 2 - Media, 3 - Dataset, 5 - Poster, 6 - Journal contribution,
          7 - Presentation, 8 - Thesis, 9 - Software, 11 - Online resource, 12 - Preprint,
          13 - Book, 14 - Conference contribution, 15 - Chapter, 16 - Peer review,
          17 - Educational resource, 18 - Report, 19 - Standard, 20 - Composition,
          21 - Funding, 22 - Physical object, 23 - Data management plan, 24 - Workflow,
          25 - Monograph, 26 - Performance, 27 - Event, 28 - Service, 29 - Model'
        format: int64
        in: query
        name: item_type
        required: false
        type: integer
      - description: only return articles with this doi
        in: query
        name: doi
        required: false
        type: string
      - description: only return articles with this handle
        in: query
        name: handle
        required: false
        type: string
      responses:
        '200':
          description: OK. An array of articles
          headers:
            X-Cursor:
              description: Unique hash used for bypassing the item retrieval limit
                of 9,000 entities.
              type: string
          schema:
            items:
              $ref: '#/definitions/Article'
            type: array
        '400':
          description: Bad Request
        '422':
          description: Unprocessable Entity. Syntax is correct but one of the parameters
            isn't correctly processed
        '500':
          description: Internal Server Error
      security: []
      summary: Public Articles
      tags:
      - articles
  /articles/{article_id}:
    get:
      description: View an article
      operationId: article_details
      parameters:
      - description: Article Unique identifier
        format: int64
        in: path
        minimum: 1
        name: article_id
        required: true
        type: integer
      responses:
        '200':
          description: OK. Article representation
          schema:
            $ref: '#/definitions/ArticleComplete'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security: []
      summary: View article details
      tags:
      - articles
      x-subcategory: Public Article
produces:
- application/json
schemes:
- https
securityDefinitions:
  OAuth2:
    authorizationUrl: https://figshare.com/account/applications/authorize
    flow: accessCode
    scopes:
      all: Grants all access
    tokenUrl: https://api.figshare.com/v2/token
    type: oauth2
