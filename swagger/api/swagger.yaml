---
swagger: "2.0"
info:
  description: "Figshare apiv2. Using Swagger 2.0"
  version: "2.0.0"
  title: "Figshare API"
host: "api.figshare.com"
basePath: "/v2"
schemes:
- "https"
produces:
- "application/json"
paths:
  /account:
    get:
      tags:
      - "other"
      summary: "Private Account information"
      description: "Account information for token/personal token"
      operationId: "private_account"
      parameters: []
      responses:
        "200":
          description: "OK. Account representation"
          schema:
            $ref: "#/definitions/Account"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
  /account/articles:
    get:
      tags:
      - "articles"
      summary: "Private Articles"
      description: "Get Own Articles"
      operationId: "private_articles_list"
      parameters:
      - name: "page"
        in: "query"
        description: "Page number. Used for pagination with page_size"
        required: false
        type: "integer"
        maximum: 5000
        minimum: 1
        format: "int64"
        x-exportParamName: "Page"
        x-optionalDataType: "Int64"
      - name: "page_size"
        in: "query"
        description: "The number of results included on a page. Used for pagination\
          \ with page"
        required: false
        type: "integer"
        default: 10
        maximum: 1000
        minimum: 1
        format: "int64"
        x-exportParamName: "PageSize"
        x-optionalDataType: "Int64"
      - name: "limit"
        in: "query"
        description: "Number of results included on a page. Used for pagination with\
          \ query"
        required: false
        type: "integer"
        maximum: 1000
        minimum: 1
        format: "int64"
        x-exportParamName: "Limit"
        x-optionalDataType: "Int64"
      - name: "offset"
        in: "query"
        description: "Where to start the listing (the offset of the first result).\
          \ Used for pagination with limit"
        required: false
        type: "integer"
        maximum: 5000
        minimum: 0
        format: "int64"
        x-exportParamName: "Offset"
        x-optionalDataType: "Int64"
      responses:
        "200":
          description: "OK. An array of articles belonging to the account"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Article"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
    post:
      tags:
      - "articles"
      summary: "Create new Article"
      description: "Create a new Article by sending article information"
      operationId: "private_article_create"
      parameters:
      - in: "body"
        name: "Article"
        description: "Article description"
        required: true
        schema:
          $ref: "#/definitions/ArticleCreate"
        x-exportParamName: "Article"
      responses:
        "201":
          description: "Created"
          schema:
            $ref: "#/definitions/LocationWarnings"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article"
  /account/articles/export:
    get:
      tags:
      - "articles"
      summary: "Account Article Report"
      description: "Return status on all reports generated for the account from the\
        \ oauth credentials"
      operationId: "account_article_report"
      parameters:
      - name: "group_id"
        in: "query"
        description: "A group ID to filter by"
        required: false
        type: "integer"
        format: "int64"
        x-exportParamName: "GroupId"
        x-optionalDataType: "Int64"
      responses:
        "200":
          description: "OK. An array of account report entries"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/AccountReport"
        "400":
          description: "Bad Request"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
    post:
      tags:
      - "articles"
      summary: "Initiate a new Report"
      description: "Initiate a new Article Report for this Account. There is a limit\
        \ of 1 report per day."
      operationId: "account_article_report_generate"
      parameters: []
      responses:
        "200":
          description: "OK. AccountReport created."
          schema:
            $ref: "#/definitions/AccountReport"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
  /account/articles/search:
    post:
      tags:
      - "articles"
      summary: "Private Articles search"
      description: "Returns a list of private articles filtered by the search parameters"
      operationId: "private_articles_search"
      parameters:
      - in: "body"
        name: "search"
        description: "Search Parameters"
        required: true
        schema:
          $ref: "#/definitions/PrivateArticleSearch"
        x-exportParamName: "Search"
      responses:
        "200":
          description: "OK. An array of articles"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/ArticleWithProject"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
  /account/articles/{article_id}:
    get:
      tags:
      - "articles"
      summary: "Article details"
      description: "View a private article"
      operationId: "private_article_details"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      responses:
        "200":
          description: "OK. Article representation"
          schema:
            $ref: "#/definitions/ArticleCompletePrivate"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article"
    put:
      tags:
      - "articles"
      summary: "Update article"
      description: "Update an article by passing full body parameters."
      operationId: "private_article_update"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - in: "body"
        name: "Article"
        description: "Full article representation"
        required: true
        schema:
          $ref: "#/definitions/ArticleUpdate"
        x-exportParamName: "Article"
      responses:
        "205":
          description: "Reset Content"
          headers:
            Location:
              type: "string"
              format: "link"
              description: "Location of newly created article"
          schema:
            $ref: "#/definitions/LocationWarningsUpdate"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article"
    delete:
      tags:
      - "articles"
      summary: "Delete article"
      description: "Delete an article"
      operationId: "private_article_delete"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      responses:
        "204":
          description: "No Content"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article"
    patch:
      tags:
      - "articles"
      summary: "Partially update article"
      description: "Partially update an article by sending only the fields to change."
      operationId: "private_article_partial_update"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - in: "body"
        name: "Article"
        description: "Subset of article fields to update"
        required: true
        schema:
          $ref: "#/definitions/ArticleUpdate"
        x-exportParamName: "Article"
      responses:
        "205":
          description: "Reset Content"
          headers:
            Location:
              type: "string"
              format: "link"
              description: "Location of the updated article"
          schema:
            $ref: "#/definitions/LocationWarningsUpdate"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article"
  /account/articles/{article_id}/authors:
    get:
      tags:
      - "articles"
      summary: "List article authors"
      description: "List article authors"
      operationId: "private_article_authors_list"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      responses:
        "200":
          description: "OK. Authors list for article"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Author"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Authors"
    post:
      tags:
      - "articles"
      summary: "Add article authors"
      description: "Associate new authors with the article. This will add new authors\
        \ to the list of already associated authors"
      operationId: "private_article_authors_add"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - in: "body"
        name: "Authors"
        description: "Authors description"
        required: true
        schema:
          $ref: "#/definitions/AuthorsCreator"
        x-exportParamName: "Authors"
      responses:
        "205":
          description: "Reset Content"
          headers:
            Location:
              type: "string"
              format: "url"
              description: "Location of list of authors"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Authors"
    put:
      tags:
      - "articles"
      summary: "Replace article authors"
      description: "Associate new authors with the article. This will remove all already\
        \ associated authors and add these new ones"
      operationId: "private_article_authors_replace"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - in: "body"
        name: "Authors"
        description: "Authors description"
        required: true
        schema:
          $ref: "#/definitions/AuthorsCreator"
        x-exportParamName: "Authors"
      responses:
        "205":
          description: "Reset Content"
          headers:
            Location:
              type: "string"
              format: "url"
              description: "Location of list of authors"
        "400":
          description: "Bad Request. Article ID must be an integer and bigger than\
            \ 0. Author with ID Not Found."
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Authors"
  /account/articles/{article_id}/authors/{author_id}:
    delete:
      tags:
      - "articles"
      summary: "Delete article author"
      description: "De-associate author from article"
      operationId: "private_article_author_delete"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - name: "author_id"
        in: "path"
        description: "Article Author unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "AuthorId"
      responses:
        "204":
          description: "No Content"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Authors"
  /account/articles/{article_id}/categories:
    get:
      tags:
      - "articles"
      summary: "List article categories"
      description: "List article categories"
      operationId: "private_article_categories_list"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      responses:
        "200":
          description: "OK. Article categories"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Category"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Categories"
    post:
      tags:
      - "articles"
      summary: "Add article categories"
      description: "Associate new categories with the article. This will add new categories\
        \ to the list of already associated categories"
      operationId: "private_article_categories_add"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - in: "body"
        name: "categories"
        required: true
        schema:
          $ref: "#/definitions/CategoriesCreator"
        x-exportParamName: "Categories"
      responses:
        "205":
          description: "Reset Content"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Categories"
    put:
      tags:
      - "articles"
      summary: "Replace article categories"
      description: "Associate new categories with the article. This will remove all\
        \ already associated categories and add these new ones"
      operationId: "private_article_categories_replace"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - in: "body"
        name: "categories"
        required: true
        schema:
          $ref: "#/definitions/CategoriesCreator"
        x-exportParamName: "Categories"
      responses:
        "205":
          description: "Reset Content"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Categories"
  /account/articles/{article_id}/categories/{category_id}:
    delete:
      tags:
      - "articles"
      summary: "Delete article category"
      description: "De-associate category from article"
      operationId: "private_article_category_delete"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - name: "category_id"
        in: "path"
        description: "Category unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "CategoryId"
      responses:
        "204":
          description: "No Content"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Categories"
  /account/articles/{article_id}/confidentiality:
    get:
      tags:
      - "articles"
      summary: "Article confidentiality details"
      description: "View confidentiality settings. The confidentiality feature is\
        \ now deprecated. This has been replaced by the new extended embargo functionality\
        \ and all items that used to be confidential have now been migrated to items\
        \ with a permanent embargo on files. All API endpoints related to this functionality\
        \ will remain for backwards compatibility, but will now be attached to the\
        \ new extended embargo workflows."
      operationId: "private_article_confidentiality_details"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      responses:
        "200":
          description: "OK. Article categories"
          schema:
            $ref: "#/definitions/ArticleConfidentiality"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Confidentiality - DEPRECATED"
    put:
      tags:
      - "articles"
      summary: "Update article confidentiality"
      description: "Update confidentiality settings. The confidentiality feature is\
        \ now deprecated. This has been replaced by the new extended embargo functionality\
        \ and all items that used to be confidential have now been migrated to items\
        \ with a permanent embargo on files. All API endpoints related to this functionality\
        \ will remain for backwards compatibility, but will now be attached to the\
        \ new extended embargo workflows."
      operationId: "private_article_confidentiality_update"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - in: "body"
        name: "reason"
        required: true
        schema:
          $ref: "#/definitions/ConfidentialityCreator"
        x-exportParamName: "Reason"
      responses:
        "205":
          description: "Reset Content"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Confidentiality - DEPRECATED"
    delete:
      tags:
      - "articles"
      summary: "Delete article confidentiality"
      description: "Delete confidentiality settings. The confidentiality feature is\
        \ now deprecated. This has been replaced by the new extended embargo functionality\
        \ and all items that used to be confidential have now been migrated to items\
        \ with a permanent embargo on files. All API endpoints related to this functionality\
        \ will remain for backwards compatibility, but will now be attached to the\
        \ new extended embargo workflows."
      operationId: "private_article_confidentiality_delete"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Confidentiality - DEPRECATED"
  /account/articles/{article_id}/download:
    get:
      tags:
      - "articles"
      summary: "Private Article Download"
      description: "Download files from a private article preserving the folder structure"
      operationId: "private_article_download"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - name: "folder_path"
        in: "query"
        description: "Folder path to download. If not provided, all files from the\
          \ article will be downloaded"
        required: false
        type: "string"
        x-exportParamName: "FolderPath"
        x-optionalDataType: "String"
      responses:
        "200":
          description: "OK"
        "403":
          description: "Insufficient permissions"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
  /account/articles/{article_id}/embargo:
    get:
      tags:
      - "articles"
      summary: "Article Embargo Details"
      description: "View a private article embargo details"
      operationId: "private_article_embargo_details"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      responses:
        "200":
          description: "OK. Embargo for article"
          schema:
            $ref: "#/definitions/ArticleEmbargo"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
      x-subcategory: "Private Article Embargo"
    put:
      tags:
      - "articles"
      summary: "Update Article Embargo"
      description: "Note: setting an article under whole embargo does not imply that\
        \ the article will be published when the embargo will expire. You must explicitly\
        \ call the publish endpoint to enable this functionality."
      operationId: "private_article_embargo_update"
      parameters:
      - name: "article_id"
        in: "path"
        description: "Article unique identifier"
        required: true
        type: "integer"
        minimum: 1
        format: "int64"
        x-exportParamName: "ArticleId"
      - in: "body"
        name: "Embargo"
        description: "Embargo description"
        required: true
        schema:
          $ref: "#/definitions/ArticleEmbargoUpdater"
        x-exportParamName: "Embargo"
      responses:
        "205":
          description: "Reset Content"
          headers:
            Location:
              type: "string"
              format: "link"
              description: "Location of embargo"
        "400":
          description: "Bad Request"
        "403":
          description: "Forbidden"
          schema:
            $ref: "#/definitions/ErrorMessage"
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      security:
      - OAuth2:
        - "all"
