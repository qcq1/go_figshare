        required: false
        type: "string"
        x-exportParamName: "AccessToken"
        x-optionalDataType: "String"
      responses:
        "200":
          description: "OK. Token information"
          schema:
            $ref: "#/definitions/OAuthToken"
        "400":
          description: "Bad Request"
        "403":
