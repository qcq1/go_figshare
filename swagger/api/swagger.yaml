      operationId: "create_token"
      parameters:
      - in: "body"
        name: "body"
        description: "Create OAuth Token Parameters"
        required: false
        schema:
          $ref: "#/definitions/CreateOAuthToken"
        x-exportParamName: "Body"
      responses:
        "200":
          description: "OK. Token created successfully <a href='http://tools.ietf.org/html/rfc6749#section-5.1'\
            \ target='_blank'>RFC 6749 Section 5.1</a>."
          schema:
            $ref: "#/definitions/OAuthToken"
        "400":
          description: "Bad Request <a href='http://tools.ietf.org/html/rfc6749#section-5.2'\
            \ target='_blank'>RFC 6749 Section 5.2</a>."
      security: []
securityDefinitions:
  OAuth2:
    type: "oauth2"
    authorizationUrl: "https://figshare.com/account/applications/authorize"
    tokenUrl: "https://api.figshare.com/v2/token"
    flow: "accessCode"
    scopes:
      all: "Grants all access"
definitions:
  Account:
    type: "object"
    required:
    - "active"
    - "created_date"
    - "email"
    - "first_name"
    - "group_id"
    - "id"
    - "institution_id"
    - "institution_user_id"
    - "last_name"
    - "maximum_file_size"
    - "modified_date"
    - "orcid_id"
    - "pending_quota_request"
    - "quota"
    - "symplectic_user_id"
    - "used_quota"
    - "used_quota_private"
    - "used_quota_public"
    - "user_id"
    properties:
      active:
        type: "integer"
        format: "int64"
        example: 0
        description: "Account activity status"
      created_date:
        type: "string"
        example: "2018-05-22T04:04:04"
        description: "Date when account was created"
      email:
        type: "string"
        example: "user@domain.com"
        description: "User email"
      first_name:
        type: "string"
        example: "Doe"
        description: "First Name"
      group_id:
        type: "integer"
        format: "int64"
        example: 0
        description: "Account group id"
      id:
        type: "integer"
        format: "int64"
        example: 1495682
        description: "Account id"
      institution_id:
        type: "integer"
        format: "int64"
        example: 1
        description: "Account institution"
      institution_user_id:
        type: "string"
        example: "djohn42"
        description: "Account institution user id"
      last_name:
        type: "string"
        example: "John"
        description: "Last Name"
      maximum_file_size:
        type: "integer"
        format: "int64"
        example: 0
        description: "Maximum upload size for account"
      modified_date:
        type: "string"
        example: "2018-05-22T04:04:04"
        description: "Date of last account modification"
      orcid_id:
        type: "string"
        example: "0000-0001-2345-6789"
        description: "ORCID iD associated to account"
      pending_quota_request:
        type: "boolean"
        example: true
        description: "True if a quota request is pending"
      quota:
        type: "integer"
        format: "int64"
        example: 0
        description: "Account quota"
      symplectic_user_id:
        type: "string"
        example: "djohn42"
        description: "Symplectic ID associated to account"
      used_quota:
        type: "integer"
        format: "int64"
        example: 0
        description: "Account total used quota"
      used_quota_private:
        type: "integer"
        format: "int64"
        example: 0
        description: "Account used private quota"
      used_quota_public:
        type: "integer"
        format: "int64"
        example: 0
        description: "Account public used quota"
      user_id:
        type: "integer"
        format: "int64"
        example: 1000001
        description: "User id associated with account, useful for example for adding\
          \ the account as an author to an item"
    example:
      institution_user_id: "djohn42"
      active: 0
      last_name: "John"
      pending_quota_request: true
      modified_date: "2018-05-22T04:04:04"
      institution_id: 1
      orcid_id: "0000-0001-2345-6789"
      group_id: 0
      maximum_file_size: 0
      user_id: 1000001
      used_quota: 0
      quota: 0
      used_quota_public: 0
      created_date: "2018-05-22T04:04:04"
      id: 1495682
      used_quota_private: 0
      first_name: "Doe"
      email: "user@domain.com"
      symplectic_user_id: "djohn42"
    x-model: "Account"
    x-tag: "other"
  AccountCreate:
    type: "object"
    required:
    - "email"
    - "last_name"
    properties:
      email:
        type: "string"
        example: "johndoe@example.com"
        description: "Email of account"
        minLength: 3
        maxLength: 150
      first_name:
        type: "string"
        example: "John"
        description: "First Name"
        maxLength: 255
        default: ""
      group_id:
        type: "integer"
        format: "int64"
        description: "Not applicable to regular users. This field is reserved to institutions/publishers\
          \ with access to assign to specific groups"
      institution_user_id:
        type: "string"
        example: "johndoe"
        description: "Institution user id"
        maxLength: 50
        default: ""
      is_active:
        type: "boolean"
        description: "Is account active"
      last_name:
        type: "string"
        example: "Doe"
        description: "Last Name"
        maxLength: 255
        default: ""
      quota:
        type: "integer"
        format: "int64"
        example: 1000
        description: "Account quota"
      symplectic_user_id:
        type: "string"
        example: "johndoe"
        description: "Symplectic user id"
        maxLength: 50
        default: ""
    x-maxCombinedLength:
      description: "The combined length of first_name and last_name must not exceed\
        \ 255 characters."
    x-model: "AccountCreate"
    x-tag: "institutions"
  AccountCreateResponse:
    type: "object"
    required:
    - "account_id"
    properties:
      account_id:
        type: "integer"
        format: "int64"
        example: 33334444
        description: "ID of created account"
    example:
      account_id: 33334444
    x-model: "AccountCreateResponse"
    x-tag: "common"
  AccountGroupRoles:
    type: "object"
    example:
      "2":
      - category: "group"
        id: 7
        name: "User"
    x-model: "AccountGroupRoles"
    x-tag: "institutions"
  AccountGroupRolesCreate:
    type: "object"
    example:
      "2":
      - 2
      - 7
      "3":
      - 7
      - 9
    x-model: "AccountGroupRolesCreate"
    x-tag: "institutions"
  AccountReport:
    type: "object"
    required:
    - "account_id"
    - "created_date"
    - "download_url"
    - "group_id"
    - "id"
    - "status"
    properties:
      account_id:
        type: "integer"
        format: "int64"
        description: "The ID of the account which generated this report."
      created_date:
        type: "string"
        example: "2017-05-15T15:12:26Z"
        description: "Date when the AccountReport was requested"
      download_url:
        type: "string"
        format: "url"
        example: "https://some.com/storage/path/123/report-456.xlsx"
        description: "The download link for the generated XLSX"
      group_id:
        type: "integer"
        format: "int64"
        description: "The group ID that was used to filter the report, if any."
      id:
        type: "integer"
        format: "int64"
        description: "A unique ID for the AccountRecord"
      status:
        type: "string"
        description: "Status of the report"
        enum:
        - "missing"
        - "pending"
        - "done"
    example:
      account_id: 0
      group_id: 6
      download_url: "https://some.com/storage/path/123/report-456.xlsx"
      created_date: "2017-05-15T15:12:26Z"
      id: 1
      status: "missing"
    x-model: "AccountReport"
  AccountUpdate:
    type: "object"
    required:
    - "group_id"
    - "is_active"
    properties:
      group_id:
        type: "integer"
        format: "int64"
        description: "Not applicable to regular users. This field is reserved to institutions/publishers\
          \ with access to assign to specific groups"
      is_active:
        type: "boolean"
        description: "Is account active"
    x-model: "AccountUpdate"
    x-tag: "institutions"
  Article:
    type: "object"
    required:
    - "created_date"
    - "defined_type"
    - "defined_type_name"
    - "doi"
    - "handle"
    - "id"
    - "resource_doi"
    - "resource_title"
    - "thumb"
    - "timeline"
    - "title"
    - "url"
    - "url_private_api"
    - "url_private_html"
    - "url_public_api"
    - "url_public_html"
    properties:
      created_date:
        type: "string"
        example: "2017-05-18T11:49:03Z"
        description: "Date when article was created"
      defined_type:
        type: "integer"
        format: "int64"
        example: 3
        description: "Type of article identifier"
      defined_type_name:
        type: "string"
        example: "media"
        description: "Name of the article type identifier"
      doi:
        type: "string"
        example: "10.6084/m9.figshare.1434614"
        description: "DOI"
      handle:
        type: "string"
        example: "111184/figshare.1234"
        description: "Handle"
      id:
        type: "integer"
        format: "int64"
        example: 1434614
        description: "Unique identifier for article"
      resource_doi:
        type: "string"
        description: "Deprecated by related materials. Not applicable to regular users.\
          \ In a publisher case, this is the publisher article DOI."
        default: ""
      resource_title:
        type: "string"
        description: "Deprecated by related materials. Not applicable to regular users.\
          \ In a publisher case, this is the publisher article title."
        default: ""
      thumb:
        type: "string"
        format: "url"
        example: "https://ndownloader.figshare.com/files/123456789/preview/12345678/thumb.png"
        description: "Thumbnail image"
      timeline:
        description: "Various timeline dates"
        $ref: "#/definitions/Timeline"
      title:
        type: "string"
        example: "Test article title"
        description: "Title of article"
      url:
        type: "string"
        format: "url"
        example: "http://api.figshare.com/articles/1434614"
        description: "Api endpoint for article"
      url_private_api:
        type: "string"
        format: "url"
        example: "https://api.figshare.com/account/articles/1434614"
        description: "Private Api endpoint for article"
      url_private_html:
        type: "string"
        format: "url"
        example: "https://figshare.com/account/articles/1434614"
        description: "Private site endpoint for article"
      url_public_api:
        type: "string"
        format: "url"
        example: "https://api.figshare.com/articles/1434614"
        description: "Public Api endpoint for article"
      url_public_html:
        type: "string"
        format: "url"
        example: "https://figshare.com/articles/media/Test_article_title/1434614"
        description: "Public site endpoint for article"
    example:
      url_private_html: "https://figshare.com/account/articles/1434614"
      thumb: "https://ndownloader.figshare.com/files/123456789/preview/12345678/thumb.png"
      url_private_api: "https://api.figshare.com/account/articles/1434614"
      url_public_html: "https://figshare.com/articles/media/Test_article_title/1434614"
      handle: "111184/figshare.1234"
      title: "Test article title"
      defined_type_name: "media"
      url: "http://api.figshare.com/articles/1434614"
      defined_type: 3
      resource_doi: "resource_doi"
      resource_title: "resource_title"
      timeline: ""
      created_date: "2017-05-18T11:49:03Z"
      id: 1434614
      url_public_api: "https://api.figshare.com/articles/1434614"
      doi: "10.6084/m9.figshare.1434614"
    x-model: "Article"
    x-tag: "articles"
  ArticleComplete:
    properties:
      authors:
        type: "array"
        description: "List of article authors"
        items:
          $ref: "#/definitions/Author"
      custom_fields:
        type: "array"
        description: "List of custom fields values"
        items:
          $ref: "#/definitions/CustomArticleField"
      download_disabled:
        type: "boolean"
        example: false
        description: "If true, downloading of files for this article is disabled"
      embargo_options:
        type: "array"
        description: "List of embargo options"
        items:
          $ref: "#/definitions/GroupEmbargoOptions"
      figshare_url:
        type: "string"
        format: "url"
        example: "http://figshare.com/articles/media/article_name/2000005"
        description: "Article public url"
      files:
        type: "array"
        description: "List of article files"
        items:
          $ref: "#/definitions/PublicFile"
      folder_structure:
        type: "object"
        example:
          "3000002": "Test Folder"
        description: "Mapping of file ids to folder paths, if folders are used"
        properties: {}
    allOf:
    - $ref: "#/definitions/ProjectArticle"
    x-model: "ArticleComplete"
    x-tag: "articles"
  ArticleCompletePrivate:
    properties:
      account_id:
        type: "integer"
        format: "int64"
        example: 1000001
        description: "ID of the account owning the article"
      curation_status:
        type: "string"
        example: "approved"
        description: "Curation status of the article"
    allOf:
    - $ref: "#/definitions/ArticleComplete"
    x-model: "ArticleCompletePrivate"
    x-tag: "articles"
  ArticleConfidentiality:
    type: "object"
    required:
    - "is_confidential"
    - "reason"
    properties:
      is_confidential:
        type: "boolean"
        example: true
        description: "True if article is confidential"
      reason:
        type: "string"
        example: "need to"
        description: "Reason for confidentiality"
    example:
      reason: "need to"
      is_confidential: true
    x-model: "ArticleConfidentiality"
    x-tag: "articles"
  ArticleCreate:
    type: "object"
    required:
    - "title"
    properties:
      authors:
        type: "array"
        example:
        - name: "John Doe"
        - id: 1000008
        description: "List of authors to be associated with the article. The list\
