      - id
      - is_selectable
      - name
      - public_description
      - string_id
      - url_name
      type: object
    RelatedMaterial:
      properties:
        id:
          description: The ID of the related material; can be used to add existing
            materials of the same account to items.
          example: 10432
          format: int64
          type: integer
        identifier:
          description: "The related material identifier (e.g., DOI, Handle, ISBN).\
            \ Mandatory if creating a new material."
          example: 10.6084/m9.figshare.1407024
          type: string
        title:
          description: The related material title
          example: "Rooter: A Methodology for the Typical Unification of Access Points\
            \ and Redundancy"
          type: string
        relation:
          default: References
          description: The relation between the item and the related material; defaults
            to 'References'. Mandatory if creating a new material.
          enum:
          - IsCitedBy
          - Cites
          - IsSupplementTo
          - IsSupplementedBy
          - IsContinuedBy
          - Continues
          - Describes
          - IsDescribedBy
          - HasMetadata
          - IsMetadataFor
          - HasVersion
          - IsVersionOf
          - IsNewVersionOf
          - IsPreviousVersionOf
          - IsPartOf
          - HasPart
          - IsPublishedIn
          - IsReferencedBy
          - References
          - IsDocumentedBy
          - Documents
          - IsCompiledBy
          - Compiles
          - IsVariantFormOf
          - IsOriginalFormOf
          - IsIdenticalTo
          - IsReviewedBy
          - Reviews
          - IsDerivedFrom
          - IsSourceOf
          - IsRequiredBy
          - Requires
          - IsObsoletedBy
          - Obsoletes
          example: IsSupplementTo
          type: string
        identifier_type:
          default: URL
          description: The type of the identifier of the related material; defaults
            to 'URL'. Mandatory if creating a new material.
          enum:
          - ARK
          - arXiv
          - bibcode
          - DOI
          - EAN13
          - EISSN
          - Handle
          - IGSN
          - ISBN
          - ISSN
          - ISTC
          - LISSN
          - LSID
          - PMID
          - PURL
          - UPC
          - URL
          - URN
          - w3id
          example: DOI
          type: string
        is_linkout:
          description: Flag for highlighting this related material in the call-out
            box
          example: true
          type: boolean
        link:
          description: The full hyperlink for the identifier. Automatically generated
            by Figshare.
          example: https://doi.org/10.6084/m9.figshare.1407024
          readOnly: true
          type: string
      type: object
