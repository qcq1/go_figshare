openapi: 3.0.1
info:
  description: Figshare apiv2. Using Swagger 2.0
  title: Figshare API
  version: 2.0.0
servers:
- url: https://api.figshare.com/v2
paths:
  /token:
    get:
      description: Returns information about the current OAuth token
      operationId: get_token_info
      parameters:
      - description: OAuth access token
        in: query
        name: access_token
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthToken'
          description: OK. Token information
        "400":
          content: {}
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
      security: []
      summary: Get OAuth token information
      tags:
      - oauth
    post:
      description: Creates OAuth token using various grant types
      operationId: create_token
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/CreateOAuthToken'
        description: Create OAuth Token Parameters
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthToken'
          description: OK. Token created successfully <a href='http://tools.ietf.org/html/rfc6749#section-5.1'
            target='_blank'>RFC 6749 Section 5.1</a>.
        "400":
          content: {}
          description: Bad Request <a href='http://tools.ietf.org/html/rfc6749#section-5.2'
            target='_blank'>RFC 6749 Section 5.2</a>.
      security: []
      summary: Create OAuth token
      tags:
      - oauth
      x-codegen-request-body-name: body
  /articles:
    get:
      description: Returns a list of public articles
      operationId: articles_list
      parameters:
      - description: "Unique hash used for bypassing the item retrieval limit of 9,000\
          \ entities. When using this parameter, please note that the offset parameter\
          \ will not be available, but the limit parameter will still work as expected."
        in: header
        name: X-Cursor
        schema:
          format: uuid
          type: string
      - description: Page number. Used for pagination with page_size
        in: query
        name: page
        schema:
          format: int64
          maximum: 5000
          minimum: 1
          type: integer
      - description: The number of results included on a page. Used for pagination
          with page
        in: query
        name: page_size
        schema:
          default: 10
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
      - description: Number of results included on a page. Used for pagination with
          query
        in: query
        name: limit
        schema:
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
      - description: Where to start the listing (the offset of the first result).
          Used for pagination with limit
        in: query
        name: offset
        schema:
          format: int64
          maximum: 5000
          minimum: 0
          type: integer
      - description: The field by which to order. Default varies by endpoint/resource.
        in: query
        name: order
        schema:
          default: published_date
          enum:
          - published_date
          - created_date
          - modified_date
          - views
          - shares
          - downloads
          - cites
          type: string
      - in: query
        name: order_direction
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
      - description: only return articles from this institution
        in: query
        name: institution
        schema:
          format: int64
          type: integer
      - description: Filter by article publishing date. Will only return articles
          published after the date. date(ISO 8601) YYYY-MM-DD or date-time(ISO 8601)
          YYYY-MM-DDTHH:mm:ssZ
        in: query
        name: published_since
        schema:
          type: string
      - description: Filter by article modified date. Will only return articles published
          after the date. date(ISO 8601) YYYY-MM-DD or date-time(ISO 8601) YYYY-MM-DDTHH:mm:ssZ
        in: query
        name: modified_since
        schema:
          type: string
      - description: only return articles from this group
        in: query
        name: group
        schema:
          format: int64
          type: integer
      - description: Deprecated by related materials. Only return articles with this
          resource_doi
        in: query
        name: resource_doi
        schema:
          type: string
      - description: "Only return articles with the respective type. Mapping for item_type\
          \ is: 1 - Figure, 2 - Media, 3 - Dataset, 5 - Poster, 6 - Journal contribution,\
          \ 7 - Presentation, 8 - Thesis, 9 - Software, 11 - Online resource, 12 -\
          \ Preprint, 13 - Book, 14 - Conference contribution, 15 - Chapter, 16 -\
          \ Peer review, 17 - Educational resource, 18 - Report, 19 - Standard, 20\
          \ - Composition, 21 - Funding, 22 - Physical object, 23 - Data management\
          \ plan, 24 - Workflow, 25 - Monograph, 26 - Performance, 27 - Event, 28\
          \ - Service, 29 - Model"
        in: query
        name: item_type
        schema:
          format: int64
          type: integer
      - description: only return articles with this doi
        in: query
        name: doi
        schema:
          type: string
      - description: only return articles with this handle
        in: query
        name: handle
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Article'
                type: array
          description: OK. An array of articles
          headers:
            X-Cursor:
              description: "Unique hash used for bypassing the item retrieval limit\
                \ of 9,000 entities."
              schema:
                type: string
        "400":
          content: {}
          description: Bad Request
        "422":
          content: {}
          description: Unprocessable Entity. Syntax is correct but one of the parameters
            isn't correctly processed
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: Public Articles
      tags:
      - articles
  /articles/search:
    post:
      description: "Returns a list of public articles, filtered by the search parameters"
      operationId: articles_search
      parameters:
      - description: "Unique hash used for bypassing the item retrieval limit of 9,000\
          \ entities. When using this parameter, please note that the offset parameter\
          \ will not be available, but the limit parameter will still work as expected."
        in: header
        name: X-Cursor
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/ArticleSearch'
        description: Search Parameters
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ArticleWithProject'
                type: array
          description: OK. An array of articles
          headers:
            X-Cursor:
              description: "Unique hash used for bypassing the item retrieval limit\
                \ of 9,000 entities."
              schema:
                type: string
        "400":
          content: {}
          description: Bad Request
        "422":
          content: {}
          description: Unprocessable Entity. Syntax is correct but one of the parameters
            isn't correctly processed
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: Public Articles Search
      tags:
      - articles
      x-codegen-request-body-name: search
  /articles/{article_id}:
    get:
      description: View an article
      operationId: article_details
      parameters:
      - description: Article Unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleComplete'
          description: OK. Article representation
        "400":
          content: {}
          description: Bad Request
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: View article details
      tags:
      - articles
      x-subcategory: Public Article
  /articles/{article_id}/versions:
    get:
      description: List public article versions
      operationId: article_versions
      parameters:
      - description: Article Unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ArticleVersions'
                type: array
          description: OK. Article version representations
        "400":
          content: {}
          description: Bad Request. Article ID must be an integer and bigger than
            0.
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: List article versions
      tags:
      - articles
      x-subcategory: Public Article
  /articles/{article_id}/versions/{version_id}:
    get:
      description: Article with specified version
      operationId: article_version_details
      parameters:
      - description: Article Unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: Article Version Number
        in: path
        name: version_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleComplete'
          description: OK. Article representation
        "400":
          content: {}
          description: Bad Request
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: Article details for version
      tags:
      - articles
      x-subcategory: Public Article
  /articles/{article_id}/versions/{version_id}/files:
    get:
      description: File by version id
      operationId: article_version_files
      parameters:
      - description: Article Unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: Article Version Unique identifier
        in: path
        name: version_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: Page number. Used for pagination with page_size
        in: query
        name: page
        schema:
          format: int64
          maximum: 5000
          minimum: 1
          type: integer
      - description: The number of results included on a page. Used for pagination
          with page
        in: query
        name: page_size
        schema:
          default: 10
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
      - description: Number of results included on a page. Used for pagination with
          query
        in: query
        name: limit
        schema:
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
      - description: Where to start the listing (the offset of the first result).
          Used for pagination with limit
        in: query
        name: offset
        schema:
          format: int64
          maximum: 5000
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicFile'
                type: array
          description: OK. List of article version files
        "400":
          content: {}
          description: Bad Request
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: Article version file details
      tags:
      - articles
      x-subcategory: Public Article version files
  /articles/{article_id}/download:
    get:
      description: Download files from a public article preserving the folder structure
      operationId: public_article_download
      parameters:
      - description: Article unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: "Folder path to download. If not provided, all files from the\
          \ article will be downloaded"
        in: query
        name: folder_path
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: OK
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: Public Article Download
      tags:
      - articles
      x-subcategory: Public Article
  /articles/{article_id}/versions/{version_id}/download:
    get:
      description: Download files from a certain version of an public article preserving
        the folder structure
      operationId: public_article_version_download
      parameters:
      - description: Article unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: Version Number
        in: path
        name: version_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: "Folder path to download. If not provided, all files from the\
          \ article will be downloaded"
        in: query
        name: folder_path
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: OK
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: Public Article Version Download
      tags:
      - articles
      x-subcategory: Public Article
  /articles/{article_id}/versions/{version_id}/embargo:
    get:
      description: Embargo for article version
      operationId: article_version_embargo
      parameters:
      - description: Article Unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: Version Number
        in: path
        name: version_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleEmbargo'
          description: OK. Embargo representation
        "400":
          content: {}
          description: Bad Request
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: Public Article Embargo for article version
      tags:
      - articles
  /articles/{article_id}/versions/{version_id}/confidentiality:
    get:
      description: "Confidentiality for article version. The confidentiality feature\
        \ is now deprecated. This has been replaced by the new extended embargo functionality\
        \ and all items that used to be confidential have now been migrated to items\
        \ with a permanent embargo on files. All API endpoints related to this functionality\
        \ will remain for backwards compatibility, but will now be attached to the\
        \ new extended embargo workflows."
      operationId: article_version_confidentiality
      parameters:
      - description: Article Unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: Version Number
        in: path
        name: version_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleConfidentiality'
          description: OK. Confidentiality representation
        "400":
          content: {}
          description: Bad Request
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: Public Article Confidentiality for article version
      tags:
      - articles
  /articles/{article_id}/files:
    get:
      description: Files list for article
      operationId: article_files
      parameters:
      - description: Article Unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: Page number. Used for pagination with page_size
        in: query
        name: page
        schema:
          format: int64
          maximum: 5000
          minimum: 1
          type: integer
      - description: The number of results included on a page. Used for pagination
          with page
        in: query
        name: page_size
        schema:
          default: 10
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
      - description: Number of results included on a page. Used for pagination with
          query
        in: query
        name: limit
        schema:
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
      - description: Where to start the listing (the offset of the first result).
          Used for pagination with limit
        in: query
        name: offset
        schema:
          format: int64
          maximum: 5000
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicFile'
                type: array
          description: OK. List of article files
        "400":
          content: {}
          description: Bad Request
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: List article files
      tags:
      - articles
      x-subcategory: Public Article files
  /articles/{article_id}/files/{file_id}:
    get:
      description: File by id
      operationId: article_file_details
      parameters:
      - description: Article Unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      - description: File Unique identifier
        in: path
        name: file_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFile'
          description: OK. File representation
        "400":
          content: {}
          description: Bad Request
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security: []
      summary: Article file details
      tags:
      - articles
      x-subcategory: Public Article files
  /account/articles/search:
    post:
      description: Returns a list of private articles filtered by the search parameters
      operationId: private_articles_search
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/PrivateArticleSearch'
        description: Search Parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ArticleWithProject'
                type: array
          description: OK. An array of articles
        "400":
          content: {}
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "500":
          content: {}
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Private Articles search
      tags:
      - articles
      x-codegen-request-body-name: search
  /account/articles:
    get:
      description: Get Own Articles
      operationId: private_articles_list
      parameters:
      - description: Page number. Used for pagination with page_size
        in: query
        name: page
        schema:
          format: int64
          maximum: 5000
          minimum: 1
          type: integer
      - description: The number of results included on a page. Used for pagination
          with page
        in: query
        name: page_size
        schema:
          default: 10
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
      - description: Number of results included on a page. Used for pagination with
          query
        in: query
        name: limit
        schema:
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
      - description: Where to start the listing (the offset of the first result).
          Used for pagination with limit
        in: query
        name: offset
        schema:
          format: int64
          maximum: 5000
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Article'
                type: array
          description: OK. An array of articles belonging to the account
        "400":
          content: {}
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "500":
          content: {}
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Private Articles
      tags:
      - articles
    post:
      description: Create a new Article by sending article information
      operationId: private_article_create
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/ArticleCreate'
        description: Article description
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationWarnings'
          description: Created
        "400":
          content: {}
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "500":
          content: {}
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Create new Article
      tags:
      - articles
      x-subcategory: Private Article
      x-codegen-request-body-name: Article
  /account/articles/{article_id}:
    delete:
      description: Delete an article
      operationId: private_article_delete
      parameters:
      - description: Article unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      responses:
        "204":
          content: {}
          description: No Content
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Delete article
      tags:
      - articles
      x-subcategory: Private Article
    get:
      description: View a private article
      operationId: private_article_details
      parameters:
      - description: Article unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleCompletePrivate'
          description: OK. Article representation
        "400":
          content: {}
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Article details
      tags:
      - articles
      x-subcategory: Private Article
    patch:
      description: Partially update an article by sending only the fields to change.
      operationId: private_article_partial_update
      parameters:
      - description: Article unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/ArticleUpdate'
        description: Subset of article fields to update
        required: true
      responses:
        "205":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationWarningsUpdate'
          description: Reset Content
          headers:
            Location:
              description: Location of the updated article
              schema:
                format: link
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Partially update article
      tags:
      - articles
      x-subcategory: Private Article
      x-codegen-request-body-name: Article
    put:
      description: Update an article by passing full body parameters.
      operationId: private_article_update
      parameters:
      - description: Article unique identifier
        in: path
        name: article_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/ArticleUpdate'
        description: Full article representation
        required: true
      responses:
        "205":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationWarningsUpdate'
          description: Reset Content
          headers:
            Location:
              description: Location of newly created article
              schema:
                format: link
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Server Error
      security:
      - OAuth2:
        - all
      summary: Update article
      tags:
      - articles
      x-subcategory: Private Article
      x-codegen-request-body-name: Article
  /account/articles/{article_id}/embargo:
    delete:
      description: Will lift the embargo for the specified article
      operationId: private_article_embargo_delete
      parameters:
