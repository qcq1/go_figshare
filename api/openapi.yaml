components:
  schemas:
    CreateOAuthToken:
      example:
        refresh_token: refresh_token
        password: password
        code: code
        grant_type: authorization_code
        client_secret: client_secret
        client_id: client_id
        username: username
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        grant_type:
          enum:
          - authorization_code
          - refresh_token
          - password
          - client_credentials
          type: string
        code:
          description: Required if grant_type is 'authorization_code'
          type: string
        refresh_token:
          description: Required if grant_type is 'refresh_token'
          type: string
        username:
          description: Required if grant_type is 'password'
          type: string
        password:
          description: Required if grant_type is 'password'
          type: string
      required:
      - client_id
      - client_secret
      - grant_type
      type: object
      x-tag: oauth
    OAuthToken:
      example:
        access_token: abcd1234567890efgh
        refresh_token: refresh_abcd1234567890efgh
        scope: all
        token_type: bearer
        expires_in: 3600
        token: abcd1234567890efgh
      properties:
        access_token:
          description: The OAuth access token
          example: abcd1234567890efgh
          type: string
        token:
          description: The OAuth access token
          example: abcd1234567890efgh
          type: string
        token_type:
          description: The type of token issued
          example: bearer
          type: string
        expires_in:
          description: Token expiration time in seconds
          example: 3600
          format: int64
          type: integer
        refresh_token:
          description: The refresh token (only provided for certain grant types)
          example: refresh_abcd1234567890efgh
          type: string
        scope:
          description: The scope of the access token
          example: all
          type: string
      required:
      - access_token
      - expires_in
      - token_type
      type: object
      x-tag: oauth
    AccountGroupRoles:
      example:
        "2":
        - category: group
          id: 7
          name: User
      type: object
      x-tag: institutions
    AccountGroupRolesCreate:
      example:
        "2":
        - 2
        - 7
        "3":
        - 7
        - 9
      type: object
      x-tag: institutions
    Group:
      example:
        association_criteria: IT
        parent_id: 0
        name: Materials
        resource_id: ""
        id: 1
      properties:
        id:
          description: Group id
          example: 1
          format: int64
          type: integer
        name:
          description: Group name
          example: Materials
          type: string
        resource_id:
          description: Group resource id
          example: ""
          type: string
        parent_id:
          description: Parent group if any
          example: 0
          format: int64
          type: integer
        association_criteria:
          description: "HR code associated with group, if code exists"
          example: IT
          type: string
      required:
      - association_criteria
      - id
      - name
      - parent_id
      - resource_id
      type: object
      x-tag: institutions
    Role:
      example:
        name: Curator
        description: description
        id: 1
        category: group
      properties:
        id:
          description: Role id
          example: 1
          format: int64
          type: integer
        name:
          description: Role name
          example: Curator
          type: string
        category:
          description: Role category
          example: group
          type: string
        description:
          description: Role description
          type: string
      required:
      - category
      - description
      - id
      - name
      type: object
      x-tag: institutions
    GroupEmbargoOptions:
      example:
        ip_name: Figshare IP range
        id: 364
        type: ip_range
      properties:
        id:
          description: Embargo option id
          example: 364
          format: int64
          type: integer
        type:
          description: Embargo permission type
          enum:
          - logged_in
          - ip_range
          - administrator
          example: ip_range
          type: string
        ip_name:
          description: IP range name; value appears if type is ip_range
          example: Figshare IP range
          type: string
      required:
      - id
      - ip_name
      - type
      type: object
      x-tag: institutions
    Institution:
      example:
        domain: "null"
        name: Institution
        id: 0
      properties:
        id:
          description: Institution id
          example: 0
          format: int64
          type: integer
        name:
          description: Institution name
          example: Institution
          type: string
        domain:
          description: Institution domain
          example: "null"
          nullable: true
          type: string
      required:
      - domain
      - id
      - name
      type: object
      x-tag: institutions
    ShortCustomField:
      example:
        settings:
          validations:
            min_length: 1
            max_length: 1000
          placeholder: Enter your custom field here
        name: my custom field
        is_mandatory: false
        id: 365
        field_type: textarea
        order: 1
      properties:
        id:
          description: Custom field id
          example: 365
          format: int64
          type: integer
        name:
          description: Custom field name
          example: my custom field
          type: string
        field_type:
          description: Custom field type
