        - label: ""
          url: https://academia.edu/profile/1
      properties:
        first_name:
          description: First name
          example: John
          type: string
        last_name:
          description: Last Name
          example: Doe
          type: string
        orcid:
          description: User ORCID
          example: 0000-0001-YYYY-XXXX
          type: string
        job_title:
          description: User job title
          example: Researcher at institution X
          type: string
        fields_of_interest:
          description: User fields of interest (category ids)
          example:
          - 1
          - 2
          items:
            description: Id of category
            format: int64
            type: integer
          type: array
        fields_of_interest_by_source_id:
          description: "User fields of interest (category source IDs), supersedes\
            \ the fields_of_interest property"
          example:
          - "3204"
          - "320401"
          items:
            description: Source ID of category
            type: string
          type: array
        location:
          description: User location
          example: "London, UK"
          type: string
        facebook:
          description: User facebook URL
          example: https://facebook.com/profile/1
          format: url
          type: string
        x:
          description: User X (twitter) URL
          example: https://x.com/profile/1
          format: url
          type: string
        linkedin:
          description: User linkedin URL
          example: https://linkedin.com/profile/2
          format: url
          type: string
        bio:
          description: User biographical information
          example: Biographical information
          type: string
        personal_profiles:
          description: Add up to 10 additional personal profile links
          example:
          - label: ResearchGate
            url: https://researchgate.net/profile/1
          - label: ""
            url: https://academia.edu/profile/1
          items:
            $ref: '#/components/schemas/ProfileUpdateData_personal_profiles_inner'
          type: array
      type: object
      x-tag: profiles
    custom_fields_upload_request:
      properties:
        external_file:
          description: CSV file to be uploaded
          format: binary
          type: string
      type: object
    institution_hrfeed_upload_request:
      properties:
        hrfeed:
          description: You can find an example in the Hr Feed section
          format: binary
          type: string
      type: object
    update_user_profile_picture_request:
      properties:
        profile_picture:
          description: User profile picture
          format: binary
          type: string
      required:
      - profile_picture
      type: object
    ProfileUpdateData_personal_profiles_inner:
      properties:
        label:
          description: Label for the personal profile link
          example: ResearchGate
          type: string
        url:
          description: URL for the personal profile link
          example: https://researchgate.net/profile/1
          format: url
          type: string
      type: object
